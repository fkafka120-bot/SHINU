<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinu — AI Interface</title>
    <style>
        :root {
            --bg-color: #030106;
            --panel-border: rgba(180, 130, 255, 0.15);
            --accent-purple: #c496ff;
            --text-main: #f0e6ff;
            --text-muted: #8a7a9e;
        }

        /* Amber Theme */
        body.theme-amber {
            --bg-color: #060403;
            --panel-border: rgba(255, 170, 80, 0.2);
            --accent-purple: #ffaa50;
            --text-main: #fffaec;
            --text-muted: #9e8a7a;
        }

        /* Neon Pink Theme */
        body.theme-pink {
            --bg-color: #060205;
            --panel-border: rgba(255, 105, 180, 0.2);
            --accent-purple: #ff69b4;
            --text-main: #ffeeff;
            --text-muted: #9e7a8e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 16px;
            transition: background-color 0.3s ease;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            padding-top: 5px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: background-color 0.3s;
        }

        /* Sliding Drawer */
        .drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100vh;
            background: rgba(12, 8, 20, 0.96);
            border-right: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s;
            z-index: 50;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        body.theme-amber .drawer { background: rgba(20, 14, 10, 0.96); }
        body.theme-pink .drawer { background: rgba(20, 10, 16, 0.96); }
        .drawer.open { left: 0; }
        
        .drawer-section-title { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--text-muted); 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
        }

        .drawer-item {
            padding: 12px 14px;
            background: rgba(180, 130, 255, 0.04);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-item:hover { background: rgba(180, 130, 255, 0.1); }
        body.theme-amber .drawer-item { background: rgba(255, 170, 80, 0.04); }
        body.theme-amber .drawer-item:hover { background: rgba(255, 170, 80, 0.1); }
        body.theme-pink .drawer-item { background: rgba(255, 105, 180, 0.04); }
        body.theme-pink .drawer-item:hover { background: rgba(255, 105, 180, 0.1); }

        .theme-submenu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
            padding-left: 10px;
            border-left: 2px solid var(--panel-border);
        }
        .theme-sub-item {
            padding: 8px 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .theme-sub-item:hover { color: var(--text-main); background: rgba(180, 130, 255, 0.06); }
        .theme-sub-item.active { color: var(--accent-purple); border-color: var(--panel-border); font-weight: 500; }
        
        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 35vh;
        }
        .history-item {
            padding: 10px 14px;
            background: rgba(180, 130, 255, 0.04);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-main);
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 40;
        }
        .backdrop.active { opacity: 1; pointer-events: auto; }

        /* Central Stage: Pure Opacity Fade (No Upward Movement) */
        .center-stage {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            pointer-events: auto;
        }

        .center-stage.dissolved {
            opacity: 0;
            pointer-events: none;
        }

        .eye-container {
            width: 110px;
            height: 55px;
            margin-bottom: 18px;
            filter: drop-shadow(0 0 15px rgba(196, 150, 255, 0.4));
            animation: eyeBlink 4s infinite ease-in-out;
        }
        body.theme-amber .eye-container { filter: drop-shadow(0 0 15px rgba(255, 170, 80, 0.4)); }
        body.theme-pink .eye-container { filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.4)); }

        @keyframes eyeBlink {
            0%, 46%, 54%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.08); }
        }

        .brand-title {
            font-size: 32px;
            letter-spacing: 10px;
            color: var(--text-main);
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(196, 150, 255, 0.3);
            margin-left: 10px;
        }
        body.theme-amber .brand-title { text-shadow: 0 0 20px rgba(255, 170, 80, 0.3); }
        body.theme-pink .brand-title { text-shadow: 0 0 20px rgba(255, 105, 180, 0.3); }

        .brand-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--accent-purple);
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .brand-divider::before, .brand-divider::after {
            content: '';
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
        }

        .open-greeting {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(196, 150, 255, 0.2);
        }

        /* Chat Stream Container (Fixed height to prevent cutoff) */
        .chat-container {
            position: absolute;
            top: 60px;
            bottom: 85px;
            width: 100%;
            max-width: 480px;
            z-index: 5;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 16px;
            scroll-behavior: smooth;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .chat-container.active { opacity: 1; }
        
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeInBubble 0.3s ease forwards;
        }

        @keyframes fadeInBubble {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.user {
            background: var(--accent-purple);
            color: #0b0614;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .message-bubble.bot {
            background: rgba(180, 130, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        body.theme-amber .message-bubble.bot { background: rgba(255, 170, 80, 0.08); }
        body.theme-pink .message-bubble.bot { background: rgba(255, 105, 180, 0.08); }

        /* Input Dock */
        .input-dock {
            position: absolute;
            bottom: 12px;
            z-index: 10;
            width: calc(100% - 32px);
            max-width: 420px;
            background: rgba(12, 8, 20, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 30px;
            padding: 8px 8px 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: background-color 0.3s;
        }
        body.theme-amber .input-dock { background: rgba(20, 14, 10, 0.9); }
        body.theme-pink .input-dock { background: rgba(20, 10, 16, 0.9); }

        .action-icon-btn {
            background: rgba(180, 130, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--accent-purple);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s, color 0.3s;
        }
        .action-icon-btn:hover { background: rgba(180, 130, 255, 0.18); }

        .input-dock input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }
        .input-dock input::placeholder { color: var(--text-muted); }

        .send-icon-btn {
            background: var(--accent-purple);
            border: none;
            color: #0b0614;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(196, 150, 255, 0.4);
            transition: transform 0.1s, background-color 0.3s;
        }
        .send-icon-btn:active { transform: scale(0.95); }
        .send-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <button class="menu-btn" id="menuToggle" title="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Sliding Menu Drawer -->
    <div class="drawer" id="sideDrawer">
        <div>
            <div class="drawer-section-title">1. Theme Options</div>
            <div class="theme-submenu">
                <button class="theme-sub-item active" data-theme="purple">Cosmic Purple</button>
                <button class="theme-sub-item" data-theme="amber">Neon Amber</button>
                <button class="theme-sub-item" data-theme="pink">Neon Pink</button>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">2. History</div>
            <div class="chat-history-list" id="historyList">
                <div style="font-size: 13px; color: var(--text-muted);">No prompts typed yet.</div>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">3. Account Setting</div>
            <div class="drawer-item">Configure Profile</div>
        </div>
    </div>
    <div class="backdrop" id="drawerBackdrop"></div>

    <!-- Central Stage: Pure slow opacity fade -->
    <div class="center-stage" id="centerStage">
        <div class="eye-container">
            <svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent-purple);">
                <path d="M5 30C30 10 90 10 115 30C90 50 30 50 5 30Z" />
                <circle cx="60" cy="30" r="12" fill="currentColor" opacity="0.8" />
                <circle cx="60" cy="30" r="5" fill="#ffffff" />
            </svg>
        </div>
        <h1 class="brand-title">SHINU</h1>
        <div class="brand-divider">·</div>
        <div class="open-greeting" id="openGreeting">Good morning!</div>
    </div>

    <!-- Live Messaging Feed -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Input Dock -->
    <div class="input-dock" id="inputDock">
        <button class="action-icon-btn">+</button>
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button class="send-icon-btn" id="sendBtn">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

<script>
    // Saved Theme Management
    const savedTheme = localStorage.getItem('shinu_theme') || 'purple';
    applyTheme(savedTheme);

    function applyTheme(themeName) {
        document.body.classList.remove('theme-amber', 'theme-pink');
        if(themeName === 'amber') {
            document.body.classList.add('theme-amber');
        } else if(themeName === 'pink') {
            document.body.classList.add('theme-pink');
        }
        
        document.querySelectorAll('.theme-sub-item').forEach(btn => {
            if(btn.getAttribute('data-theme') === themeName) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        localStorage.setItem('shinu_theme', themeName);
    }

    document.querySelectorAll('.theme-sub-item').forEach(btn => {
        btn.onclick = () => {
            applyTheme(btn.getAttribute('data-theme'));
        };
    });

    // Time-aware greeting
    const hour = new Date().getHours();
    const greetingEl = document.getElementById('openGreeting');
    if (hour >= 5 && hour < 12) {
        greetingEl.textContent = "Good morning!";
    } else if (hour >= 12 && hour < 17) {
        greetingEl.textContent = "Good afternoon!";
    } else if (hour >= 17 && hour < 22) {
        greetingEl.textContent = "Good evening!";
    } else {
        greetingEl.textContent = "Late night hustle?";
    }

    const menuToggle = document.getElementById('menuToggle');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const centerStage = document.getElementById('centerStage');
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const historyList = document.getElementById('historyList');

    function toggleDrawer() {
        sideDrawer.classList.toggle('open');
        drawerBackdrop.classList.toggle('active');
    }

    menuToggle.onclick = toggleDrawer;
    drawerBackdrop.onclick = toggleDrawer;

    let chatStarted = false;

    userInput.addEventListener('focus', () => {
        if(!chatStarted) {
            centerStage.classList.add('dissolved');
            chatContainer.classList.add('active');
            chatStarted = true;
        }
    });

    // Shinu Reply & Response Intelligence Engine
    function shinuReply(inputMessage) {
        const query = inputMessage.toLowerCase().trim();

        if (query.includes('hello') || query.includes('hi') || query.includes('hey')) {
            return "Hello! Shinu engine is active. What are we building or exploring today?";
        } else if (query.includes('who are you') || query.includes('what is shinu')) {
            return "I am Shinu, your high-end procedural media and developer workspace engine.";
        } else if (query.includes('version') || query.includes('v1')) {
            return "Shinu Engine v1.0 Pro is currently deployed and online via Vercel.";
        } else if (query.includes('help') || query.includes('options')) {
            return "You can use the 3-lines menu to switch themes (Purple, Amber, Pink) or check your typed history!";
        } else if (query.includes('time')) {
            return "Current system local time is " + new Date().toLocaleTimeString() + ".";
        } else {
            return `Pipeline compiled successfully for your query: "${inputMessage}". All systems nominal.`;
        }
    }

    // Handle Sending & Reply Simulation
    function handleSend() {
        const text = userInput.value.trim();
        if(!text) return;

        if(!chatStarted) {
            centerStage.classList.add('dissolved');
            chatContainer.classList.add('active');
            chatStarted = true;
        }

        chatContainer.innerHTML += `<div class="message-bubble user">${escapeHtml(text)}</div>`;
        chatContainer.scrollTop = chatContainer.scrollHeight;

        if(historyList.innerHTML.includes('No prompts typed yet')) {
            historyList.innerHTML = '';
        }
        historyList.innerHTML += `<div class="history-item">${escapeHtml(text)}</div>`;

        userInput.value = '';
        userInput.blur();

        setTimeout(() => {
            const responseText = shinuReply(text);
            chatContainer.innerHTML += `<div class="message-bubble bot">${escapeHtml(responseText)}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 500);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('sendBtn').onclick = handleSend;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };

    // Background Particle Canvas
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    let waveOffset = 0;
    const particles = [];
    for(let i = 0; i < 25; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 1.5 + 0.5,
            speedY: (Math.random() - 0.5) * 0.3,
            speedX: (Math.random() - 0.5) * 0.3,
            alpha: Math.random() * 0.5 + 0.2
        });
    }

    function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 1.2;

        const isAmber = document.body.classList.contains('theme-amber');
        const isPink = document.body.classList.contains('theme-pink');
        
        let strokeColor = 'rgba(196, 150, 255, 0.12)';
        let strokeColor2 = 'rgba(210, 180, 255, 0.08)';
        let particleColor = '210, 180, 255';

        if(isAmber) {
            strokeColor = 'rgba(255, 170, 80, 0.12)';
            strokeColor2 = 'rgba(255, 200, 120, 0.08)';
            particleColor = '255, 200, 120';
        } else if(isPink) {
            strokeColor = 'rgba(255, 105, 180, 0.12)';
            strokeColor2 = 'rgba(255, 160, 210, 0.08)';
            particleColor = '255, 160, 210';
        }

        ctx.strokeStyle = strokeColor;
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 450, Math.PI * 0.75, Math.PI * 1.35);
        ctx.stroke();

        ctx.strokeStyle = strokeColor2;
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 320, Math.PI * 0.8, Math.PI * 1.3);
        ctx.stroke();

        ctx.strokeStyle = strokeColor;
        ctx.beginPath();
        ctx.arc(-50, canvas.height + 50, 500, Math.PI * 1.7, Math.PI * 2.15);
        ctx.stroke();

        waveOffset += 0.4;

        particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;

            if(p.y < 0) p.y = canvas.height;
            if(p.y > canvas.height) p.y = 0;
            if(p.x < 0) p.x = canvas.width;
            if(p.x > canvas.width) p.x = 0;

            ctx.fillStyle = `rgba(${particleColor}, ${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(drawBackground);
    }
    drawBackground();
</script>

</body>
</html>
