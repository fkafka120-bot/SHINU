<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinu — AI Interface</title>
    <style>
        :root {
            --bg-color: #030106;
            --panel-border: rgba(180, 130, 255, 0.15);
            --accent-purple: #c496ff;
            --text-main: #f0e6ff;
            --text-muted: #8a7a9e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            padding-top: 10px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
        }

        /* Sliding Drawer (Now contains History & Options) */
        .drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100vh;
            background: rgba(12, 8, 20, 0.96);
            border-right: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .drawer.open { left: 0; }
        
        .drawer-section-title { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--text-muted); 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
        }
        
        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
        }
        .history-item {
            padding: 10px 14px;
            background: rgba(180, 130, 255, 0.04);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-main);
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 40;
        }
        .backdrop.active { opacity: 1; pointer-events: auto; }

        .center-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -30px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .center-stage.dissolved {
            opacity: 0;
            transform: translateY(-25px);
            pointer-events: none;
        }

        /* Blinking Eye Animation Container */
        .eye-container {
            width: 110px;
            height: 55px;
            margin-bottom: 18px;
            filter: drop-shadow(0 0 15px rgba(196, 150, 255, 0.4));
            animation: eyeBlink 4s infinite ease-in-out;
        }

        @keyframes eyeBlink {
            0%, 46%, 54%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.08); }
        }

        .brand-title {
            font-size: 32px;
            letter-spacing: 10px;
            color: var(--text-main);
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(196, 150, 255, 0.3);
            margin-left: 10px;
        }

        .brand-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--accent-purple);
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .brand-divider::before, .brand-divider::after {
            content: '';
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
        }

        .open-greeting {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(196, 150, 255, 0.2);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .open-greeting.dissolved {
            opacity: 0;
            transform: translateY(-15px);
            pointer-events: none;
        }

        .input-dock {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(12, 8, 20, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 30px;
            padding: 8px 8px 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 80px;
            transition: transform 0.3s ease;
        }

        .action-icon-btn {
            background: rgba(180, 130, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--accent-purple);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-icon-btn:hover { background: rgba(180, 130, 255, 0.18); }

        .input-dock input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }
        .input-dock input::placeholder { color: var(--text-muted); }

        .send-icon-btn {
            background: var(--accent-purple);
            border: none;
            color: #0b0614;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(196, 150, 255, 0.4);
            transition: transform 0.1s;
        }
        .send-icon-btn:active { transform: scale(0.95); }
        .send-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <button class="menu-btn" id="menuToggle" title="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Sliding Menu Drawer Containing History -->
    <div class="drawer" id="sideDrawer">
        <div>
            <div class="drawer-section-title">Navigation</div>
            <div style="padding: 10px 14px; background: rgba(180,130,255,0.06); border-radius: 8px; font-size: 13.5px; cursor: pointer; margin-bottom: 15px;">Engine Studio</div>
        </div>
        <div>
            <div class="drawer-section-title">Typed History</div>
            <div class="chat-history-list" id="historyList">
                <div style="font-size: 13px; color: var(--text-muted);">No prompts typed yet.</div>
            </div>
        </div>
    </div>
    <div class="backdrop" id="drawerBackdrop"></div>

    <div class="center-stage" id="centerStage">
        <div class="eye-container">
            <svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent-purple);">
                <path d="M5 30C30 10 90 10 115 30C90 50 30 50 5 30Z" />
                <circle cx="60" cy="30" r="12" fill="currentColor" opacity="0.8" />
                <circle cx="60" cy="30" r="5" fill="#ffffff" />
            </svg>
        </div>
        <h1 class="brand-title">SHINU</h1>
        <div class="brand-divider">·</div>
        <div class="open-greeting" id="openGreeting">Good morning!</div>
    </div>

    <div class="input-dock" id="inputDock">
        <button class="action-icon-btn">+</button>
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button class="send-icon-btn" id="sendBtn">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

<script>
    // Time-Aware Greeting logic with "Late night hustle?" for midnight hours
    const hour = new Date().getHours();
    const greetingEl = document.getElementById('openGreeting');
    if (hour >= 5 && hour < 12) {
        greetingEl.textContent = "Good morning!";
    } else if (hour >= 12 && hour < 17) {
        greetingEl.textContent = "Good afternoon!";
    } else if (hour >= 17 && hour < 22) {
        greetingEl.textContent = "Good evening!";
    } else {
        greetingEl.textContent = "Late night hustle?";
    }

    const menuToggle = document.getElementById('menuToggle');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const centerStage = document.getElementById('centerStage');
    const openGreeting = document.getElementById('openGreeting');
    const userInput = document.getElementById('userInput');
    const inputDock = document.getElementById('inputDock');
    const historyList = document.getElementById('historyList');

    function toggleDrawer() {
        sideDrawer.classList.toggle('open');
        drawerBackdrop.classList.toggle('active');
    }

    menuToggle.onclick = toggleDrawer;
    drawerBackdrop.onclick = toggleDrawer;

    userInput.addEventListener('focus', () => {
        centerStage.classList.add('dissolved');
        openGreeting.classList.add('dissolved');
        inputDock.style.transform = 'translateY(-20px)';
    });

    userInput.addEventListener('blur', () => {
        if(userInput.value.trim() === '') {
            centerStage.classList.remove('dissolved');
            openGreeting.classList.remove('dissolved');
            inputDock.style.transform = 'translateY(0)';
        }
    });

    function handleSend() {
        const text = userInput.value.trim();
        if(!text) return;

        if(historyList.innerHTML.includes('No prompts typed yet')) {
            historyList.innerHTML = '';
        }
        historyList.innerHTML += `<div class="history-item">${text}</div>`;

        userInput.value = '';
        userInput.blur();
    }

    document.getElementById('sendBtn').onclick = handleSend;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };

    // Canvas Background with Corsive Curves & Floating Particles
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    let waveOffset = 0;

    // Generate floating background particles
    const particles = [];
    for(let i = 0; i < 25; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 1.5 + 0.5,
            speedY: (Math.random() - 0.5) * 0.3,
            speedX: (Math.random() - 0.5) * 0.3,
            alpha: Math.random() * 0.5 + 0.2
        });
    }

    function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 1.2;

        // Background Orbital Arcs
        ctx.strokeStyle = 'rgba(196, 150, 255, 0.12)';
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 450, Math.PI * 0.75, Math.PI * 1.35);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(210, 180, 255, 0.08)';
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 320, Math.PI * 0.8, Math.PI * 1.3);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(180, 120, 255, 0.12)';
        ctx.beginPath();
        ctx.arc(-50, canvas.height + 50, 500, Math.PI * 1.7, Math.PI * 2.15);
        ctx.stroke();

        // Flowing Sine Wave
        ctx.strokeStyle = 'rgba(196, 150, 255, 0.06)';
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 15) {
            let y = (canvas.height * 0.5) + Math.sin((x + waveOffset) * 0.008) * 80 + Math.cos((x - waveOffset) * 0.004) * 40;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        waveOffset += 0.4;

        // Render & Update Floating Particles (BGM Animation)
        particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;

            if(p.y < 0) p.y = canvas.height;
            if(p.y > canvas.height) p.y = 0;
            if(p.x < 0) p.x = canvas.width;
            if(p.x > canvas.width) p.x = 0;

            ctx.fillStyle = `rgba(210, 180, 255, ${p.alpha})`;
            ctx.shadowColor = 'rgba(196, 150, 255, 0.8)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(drawBackground);
    }
    drawBackground();
</script>

</body>
</html>
