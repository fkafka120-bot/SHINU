<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinu — AI Interface</title>
    <style>
        :root {
            --bg-color: #030106;
            --panel-border: rgba(180, 130, 255, 0.15);
            --accent-purple: #c496ff;
            --text-main: #f0e6ff;
            --text-muted: #8a7a9e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            padding-top: 10px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: rgba(12, 8, 20, 0.95);
            border-right: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .drawer.open { left: 0; }
        .drawer-title { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }
        .drawer-item { padding: 12px 16px; border-radius: 10px; background: rgba(180,130,255,0.04); border: 1px solid var(--panel-border); cursor: pointer; font-size: 14px; color: var(--text-main); transition: background 0.2s; }
        .drawer-item:hover { background: rgba(180,130,255,0.1); }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 40;
        }
        .backdrop.active { opacity: 1; pointer-events: auto; }

        /* Central Stage with Dissolve Transition */
        .center-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .center-stage.dissolved {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        .eye-container {
            width: 110px;
            height: 55px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(196, 150, 255, 0.4));
        }

        .brand-title {
            font-size: 32px;
            letter-spacing: 10px;
            color: var(--text-main);
            font-weight: 300;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(196, 150, 255, 0.3);
            margin-left: 10px;
        }

        .brand-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--accent-purple);
            opacity: 0.8;
        }

        .brand-divider::before, .brand-divider::after {
            content: '';
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
        }

        /* Greeting Bubble with Dissolve Transition */
        .greeting-bubble {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(12, 8, 20, 0.85);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 20px 24px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .greeting-bubble.dissolved {
            opacity: 0;
            transform: translateY(-15px);
            pointer-events: none;
        }

        .bubble-star {
            color: var(--accent-purple);
            font-size: 18px;
            margin-top: 2px;
            text-shadow: 0 0 10px var(--accent-purple);
        }

        .bubble-content h3 {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .bubble-content p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Input Dock that shifts smoothly above mobile keyboards */
        .input-dock {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(12, 8, 20, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 30px;
            padding: 8px 8px 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        .action-icon-btn {
            background: rgba(180, 130, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--accent-purple);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-icon-btn:hover { background: rgba(180, 130, 255, 0.18); }

        .input-dock input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }
        .input-dock input::placeholder { color: var(--text-muted); }

        .send-icon-btn {
            background: var(--accent-purple);
            border: none;
            color: #0b0614;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(196, 150, 255, 0.4);
            transition: transform 0.1s;
        }
        .send-icon-btn:active { transform: scale(0.95); }
        .send-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <button class="menu-btn" id="menuToggle" title="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <div class="drawer" id="sideDrawer">
        <div class="drawer-title">Navigation</div>
        <div class="drawer-item">Engine Studio</div>
        <div class="drawer-item">Saved Prompts</div>
        <div class="drawer-item">Copyright & Control</div>
    </div>
    <div class="backdrop" id="drawerBackdrop"></div>

    <div class="center-stage" id="centerStage">
        <div class="eye-container">
            <svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent-purple);">
                <path d="M5 30C30 10 90 10 115 30C90 50 30 50 5 30Z" />
                <circle cx="60" cy="30" r="12" fill="currentColor" opacity="0.8" />
                <circle cx="60" cy="30" r="5" fill="#ffffff" />
            </svg>
        </div>
        <h1 class="brand-title">SHINU</h1>
        <div class="brand-divider">✦</div>
    </div>

    <div class="greeting-bubble" id="greetingBubble">
        <div class="bubble-star">✦</div>
        <div class="bubble-content">
            <h3>Hello!</h3>
            <p>How can I help you today?</p>
        </div>
    </div>

    <div class="input-dock" id="inputDock">
        <button class="action-icon-btn">+</button>
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button class="send-icon-btn" id="sendBtn">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

<script>
    const menuToggle = document.getElementById('menuToggle');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const centerStage = document.getElementById('centerStage');
    const greetingBubble = document.getElementById('greetingBubble');
    const userInput = document.getElementById('userInput');

    function toggleDrawer() {
        sideDrawer.classList.toggle('open');
        drawerBackdrop.classList.toggle('active');
    }

    menuToggle.onclick = toggleDrawer;
    drawerBackdrop.onclick = toggleDrawer;

    // Dissolve and keyboard shift behavior on focus/typing
    userInput.onfocus = () => {
        centerStage.classList.add('dissolved');
        greetingBubble.classList.add('dissolved');
    };

    userInput.onblur = () => {
        if(userInput.value.trim() === '') {
            centerStage.classList.remove('dissolved');
            greetingBubble.classList.remove('dissolved');
        }
    };

    // Canvas Background Starfield
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(180, 130, 255, 0.08)';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        ctx.arc(canvas.width + 100, -50, 400, Math.PI * 0.8, Math.PI * 1.3);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-50, canvas.height + 100, 500, Math.PI * 1.7, Math.PI * 2.1);
        ctx.stroke();

        const stars = [
            {x: canvas.width * 0.8, y: 100, size: 2},
            {x: canvas.width * 0.85, y: 90, size: 1},
            {x: canvas.width * 0.15, y: canvas.height * 0.75, size: 1.5},
            {x: canvas.width * 0.5, y: canvas.height * 0.3, size: 1}
        ];

        stars.forEach(s => {
            ctx.fillStyle = 'rgba(210, 180, 255, 0.6)';
            ctx.shadowColor = 'rgba(196, 150, 255, 0.8)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(drawBackground);
    }
    drawBackground();

    document.getElementById('sendBtn').onclick = handleSend;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };

    function handleSend() {
        const text = userInput.value.trim();
        if(!text) return;
        alert(`Prompt sent to Shinu engine: "${text}"`);
        userInput.value = '';
        userInput.blur();
    }
</script>

</body>
</html>
