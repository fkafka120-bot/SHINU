<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shinu — High-End AI Workspace</title>
    <style>
        :root {
            --bg-color: #030107;
            --panel-bg: rgba(14, 10, 24, 0.75);
            --panel-border: rgba(196, 150, 255, 0.18);
            --accent-purple: #c496ff;
            --accent-glow: rgba(196, 150, 255, 0.35);
            --text-main: #f4ecff;
            --text-muted: #8d7b9e;
            --drawer-bg: rgba(8, 6, 14, 0.94);
        }

        body.theme-amber {
            --bg-color: #070402;
            --panel-bg: rgba(22, 14, 10, 0.75);
            --panel-border: rgba(255, 170, 80, 0.22);
            --accent-purple: #ffaa50;
            --accent-glow: rgba(255, 170, 80, 0.35);
            --text-main: #fff5ec;
            --text-muted: #9e8c7a;
            --drawer-bg: rgba(14, 10, 8, 0.94);
        }

        body.theme-pink {
            --bg-color: #070206;
            --panel-bg: rgba(22, 10, 18, 0.75);
            --panel-border: rgba(255, 105, 180, 0.22);
            --accent-purple: #ff69b4;
            --accent-glow: rgba(255, 105, 180, 0.35);
            --text-main: #ffecfa;
            --text-muted: #9e7a8e;
            --drawer-bg: rgba(14, 6, 11, 0.94);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100%;
            height: 100vh;
            height: 100dvh; /* fixes the cut-off input on mobile browsers */
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 16px 16px max(16px, env(safe-area-inset-bottom));
            padding-top: max(16px, env(safe-area-inset-top));
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ---------- Header: menu + topic bar ---------- */
        header {
            width: 100%;
            max-width: 480px;
            height: 42px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            flex-shrink: 0;
        }

        .menu-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 13px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .menu-btn:hover { transform: scale(1.05); border-color: var(--accent-purple); box-shadow: 0 0 20px var(--accent-glow); }
        .menu-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
        }

        .topic-bar {
            flex: 1;
            min-width: 0;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 13px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .topic-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--accent-purple);
            box-shadow: 0 0 8px var(--accent-purple);
            animation: topicPulse 2.8s ease-in-out infinite;
        }
        @keyframes topicPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .topic-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .topic-divider {
            width: 1px;
            height: 16px;
            background: var(--panel-border);
            flex-shrink: 0;
        }
        .topic-text {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .topic-text.swap { opacity: 0; transform: translateY(4px); }
        .topic-bar.idle .topic-text { color: var(--text-muted); font-weight: 500; }
        .topic-bar.idle .topic-dot { opacity: 0.4; animation: none; }

        /* ---------- Natural eye ---------- */
        .eye-svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .eye-svg .crease { fill: none; stroke: var(--accent-purple); stroke-width: 1; stroke-linecap: round; opacity: 0.3; }
        .eye-svg .caruncle { fill: var(--accent-purple); opacity: 0.45; }
        .eye-svg .iris-base { fill: var(--accent-purple); }
        .eye-svg .fibers { fill: none; stroke: #fff; stroke-opacity: 0.28; stroke-width: 4; stroke-dasharray: 0.6 1.6; }
        .eye-svg .fibers-dark { fill: none; stroke: #000; stroke-opacity: 0.3; stroke-width: 2.4; stroke-dasharray: 0.5 1.9; }
        .eye-svg .collarette { fill: none; stroke: #fff; stroke-opacity: 0.18; stroke-width: 0.7; }
        .eye-svg .limbal { fill: none; stroke: #000; stroke-opacity: 0.55; stroke-width: 1.4; }
        .eye-svg .pupil circle { fill: #06030c; }
        .eye-svg .pupil { transform-box: fill-box; transform-origin: center; animation: pupilBreathe 6s ease-in-out infinite; }
        @keyframes pupilBreathe {
            0%, 100% { transform: scale(0.9); }
            50% { transform: scale(1.08); }
        }
        .eye-svg .iris-move {
            transform: translate(var(--ex, 0px), var(--ey, 0px));
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .eye-svg .glint-move {
            transform: translate(calc(var(--ex, 0px) * 0.55), calc(var(--ey, 0px) * 0.55));
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .eye-svg .lid-fill { fill: color-mix(in srgb, var(--accent-purple) 16%, var(--bg-color)); }
        .eye-svg .lid-edge { fill: none; stroke: var(--accent-purple); stroke-width: 2.4; stroke-linecap: round; }
        .eye-svg .lid { animation: eyeBlink 5.5s infinite ease-in-out; }
        @keyframes eyeBlink {
            0%, 90%, 100% { transform: translateY(0); }
            93.5% { transform: translateY(35px); }
            97% { transform: translateY(0); }
        }
        .eye-svg .lash-top { fill: none; stroke: var(--accent-purple); stroke-width: 2.6; stroke-linecap: round; }
        .eye-svg .lash-bottom { fill: none; stroke: var(--accent-purple); stroke-width: 1.2; stroke-linecap: round; opacity: 0.7; }

        /* ---------- Drawer ---------- */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: min(330px, 86vw);
            height: 100vh;
            height: 100dvh;
            background: var(--drawer-bg);
            border-right: 1px solid var(--panel-border);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transform: translateX(-105%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            padding: max(22px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 22px;
            box-shadow: 20px 0 60px rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }

        .drawer-brand { display: flex; align-items: center; gap: 14px; }
        .mini-eye { width: 48px; height: 24px; flex-shrink: 0; filter: drop-shadow(0 0 8px var(--accent-glow)); }
        .drawer-brand span { font-size: 18px; letter-spacing: 6px; font-weight: 300; text-shadow: 0 0 20px var(--accent-glow); }

        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 16px;
            background: var(--accent-purple);
            color: #050308;
            border: none;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 28px var(--accent-glow);
            transition: transform 0.2s, filter 0.2s;
        }
        .new-chat-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .new-chat-btn:active { transform: scale(0.97); }
        .new-chat-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; }

        .drawer-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-purple);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .theme-submenu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 12px;
            border-left: 2px solid var(--panel-border);
        }
        .theme-sub-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .theme-sub-item:hover { color: var(--text-main); background: rgba(255,255,255,0.04); }
        .theme-sub-item.active { color: var(--accent-purple); border-color: var(--panel-border); background: rgba(255,255,255,0.06); font-weight: 600; }

        /* Neon dots */
        .theme-sub-item .dot {
            --dot: #c496ff;
            position: relative;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            background: radial-gradient(circle at 35% 30%, #fff 0%, var(--dot) 45%, var(--dot) 100%);
            box-shadow: 0 0 6px var(--dot), 0 0 14px color-mix(in srgb, var(--dot) 55%, transparent);
            opacity: 0.55;
            transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .theme-sub-item:hover .dot { opacity: 0.9; transform: scale(1.15); }
        .theme-sub-item.active .dot {
            opacity: 1;
            box-shadow: 0 0 8px var(--dot), 0 0 20px var(--dot);
        }
        .theme-sub-item.active .dot::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1px solid var(--dot);
            opacity: 0.6;
            animation: dotPulse 2.4s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { transform: scale(0.85); opacity: 0.65; }
            50% { transform: scale(1.25); opacity: 0; }
        }

        .chat-history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 32vh;
            overflow-y: auto;
        }
        .history-empty { font-size: 13.5px; color: var(--text-muted); }
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 11px 12px 11px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            font-size: 13.5px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-item:hover { background: rgba(255,255,255,0.07); transform: translateX(3px); }
        .history-item.active { border-color: var(--accent-purple); box-shadow: 0 0 16px var(--accent-glow); }
        .history-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .history-item .del {
            background: none; border: none; color: var(--text-muted);
            font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
        }
        .history-item .del:hover { color: var(--text-main); background: rgba(255,255,255,0.08); }

        .drawer-item {
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }
        .drawer-item:hover { background: rgba(255,255,255,0.07); transform: translateX(4px); }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 40;
        }
        .backdrop.active { opacity: 1; pointer-events: auto; }

        /* ---------- Center stage ---------- */
        .center-stage {
            position: absolute;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .center-stage.dissolved { opacity: 0; pointer-events: none; }

        .eye-container {
            width: 132px;
            height: 66px;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 25px var(--accent-glow));
        }

        .brand-title {
            font-size: 36px;
            letter-spacing: 14px;
            color: var(--text-main);
            font-weight: 300;
            margin-bottom: 12px;
            text-shadow: 0 0 30px var(--accent-glow);
            margin-left: 14px;
        }
        .brand-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--accent-purple);
            opacity: 0.8;
            margin-bottom: 18px;
        }
        .brand-divider::before, .brand-divider::after {
            content: '';
            width: 70px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
        }
        .open-greeting {
            font-size: 16.5px;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        /* ---------- Chat ---------- */
        .chat-container {
            flex: 1;
            min-height: 0; /* lets the feed shrink so the input dock is never pushed off-screen */
            width: 100%;
            max-width: 480px;
            z-index: 5;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 14px 12px;
            scroll-behavior: smooth;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            margin-bottom: 12px;
        }
        .chat-container.active { opacity: 1; pointer-events: auto; }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .message-bubble {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeInBubble 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInBubble {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message-bubble.user {
            background: var(--accent-purple);
            color: #050308;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            font-weight: 600;
            box-shadow: 0 6px 22px var(--accent-glow);
        }
        .message-bubble.bot {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }

        .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
        .typing i {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent-purple);
            animation: typingDot 1s infinite ease-in-out;
        }
        .typing i:nth-child(2) { animation-delay: 0.15s; }
        .typing i:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingDot {
            0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-4px); }
        }

        /* ---------- Input dock ---------- */
        .input-dock {
            width: 100%;
            max-width: 480px;
            z-index: 10;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 34px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            flex-shrink: 0;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-dock:focus-within { border-color: var(--accent-purple); box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 24px var(--accent-glow); }

        .action-icon-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
            color: var(--accent-purple);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .action-icon-btn:hover { background: rgba(255,255,255,0.09); transform: scale(1.05); }

        .input-dock input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px; /* 16px stops mobile browsers auto-zooming on focus */
            outline: none;
        }
        .input-dock input::placeholder { color: var(--text-muted); }

        .send-icon-btn {
            background: var(--accent-purple);
            border: none;
            color: #050308;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.2s, filter 0.2s;
        }
        .send-icon-btn:hover { filter: brightness(1.1); }
        .send-icon-btn:active { transform: scale(0.92); }
        .send-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

        @media (prefers-reduced-motion: reduce) {
            .eye-svg .lid, .eye-svg .pupil, .typing i, .topic-dot { animation: none; }
        }
    </style>
</head>
<body>

    <!-- Shared eye definitions (gradients + eye-shaped clip) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <clipPath id="eyeClip">
                <path d="M6 32C28 8 92 8 114 32C94 48 26 48 6 32Z"/>
            </clipPath>
            <radialGradient id="eyeSclera" cx="50%" cy="50%" r="55%">
                <stop offset="0" style="stop-color: var(--text-main)" stop-opacity="0.95"/>
                <stop offset="0.62" style="stop-color: var(--text-main)" stop-opacity="0.82"/>
                <stop offset="1" style="stop-color: var(--accent-purple)" stop-opacity="0.55"/>
            </radialGradient>
            <radialGradient id="irisShade" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#000" stop-opacity="0"/>
                <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
                <stop offset="0.85" stop-color="#000" stop-opacity="0.3"/>
                <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
            </radialGradient>
            <radialGradient id="irisGlow" cx="50%" cy="78%" r="55%">
                <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="lidShadow" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0.18" stop-color="#000" stop-opacity="0.6"/>
                <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
                <stop offset="0.8" stop-color="#000" stop-opacity="0"/>
                <stop offset="0.95" stop-color="#000" stop-opacity="0.3"/>
            </linearGradient>
        </defs>
    </svg>

    <canvas id="bgCanvas"></canvas>

    <header>
        <button class="menu-btn" id="menuToggle" title="Menu" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
        <div class="topic-bar idle" id="topicBar">
            <span class="topic-dot"></span>
            <span class="topic-label">Topic</span>
            <span class="topic-divider"></span>
            <span class="topic-text" id="topicText">New Chat</span>
        </div>
    </header>

    <!-- Sliding Menu Drawer -->
    <div class="drawer" id="sideDrawer">
        <div class="drawer-brand">
            <div class="mini-eye" data-eye></div>
            <span>SHINU</span>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New Chat
        </button>

        <div>
            <div class="drawer-section-title">Theme Options</div>
            <div class="theme-submenu">
                <button class="theme-sub-item active" data-theme="purple"><span class="dot" style="--dot:#c496ff"></span>Cosmic Purple</button>
                <button class="theme-sub-item" data-theme="amber"><span class="dot" style="--dot:#ffaa50"></span>Neon Amber</button>
                <button class="theme-sub-item" data-theme="pink"><span class="dot" style="--dot:#ff69b4"></span>Neon Pink</button>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">History</div>
            <div class="chat-history-list" id="historyList"></div>
        </div>
        <div>
            <div class="drawer-section-title">Account Setting</div>
            <div class="drawer-item">Configure Profile</div>
        </div>
    </div>
    <div class="backdrop" id="drawerBackdrop"></div>

    <!-- Central Stage -->
    <div class="center-stage" id="centerStage">
        <div class="eye-container" data-eye></div>
        <h1 class="brand-title">SHINU</h1>
        <div class="brand-divider">·</div>
        <div class="open-greeting" id="openGreeting">Good morning!</div>
    </div>

    <!-- Live Messaging Feed -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Input Dock -->
    <div class="input-dock" id="inputDock">
        <button class="action-icon-btn" aria-label="Add">+</button>
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
        <button class="send-icon-btn" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

<script>
    // ---------- Eye markup (injected into every [data-eye] element) ----------
    const EYE_SVG = `
    <svg class="eye-svg" viewBox="0 0 120 60" aria-hidden="true">
        <path class="crease" d="M16 24C34 3 86 3 104 24"/>
        <g clip-path="url(#eyeClip)">
            <path d="M6 32C28 8 92 8 114 32C94 48 26 48 6 32Z" fill="url(#eyeSclera)"/>
            <ellipse class="caruncle" cx="10" cy="32" rx="3.2" ry="2.2"/>
            <g class="iris-move">
                <circle class="iris-base" cx="60" cy="30" r="13"/>
                <circle cx="60" cy="30" r="13" fill="url(#irisShade)"/>
                <circle cx="60" cy="30" r="13" fill="url(#irisGlow)"/>
                <circle class="fibers" cx="60" cy="30" r="9.5"/>
                <circle class="fibers-dark" cx="60" cy="30" r="11.4"/>
                <circle class="collarette" cx="60" cy="30" r="7"/>
                <circle class="limbal" cx="60" cy="30" r="12.6"/>
                <g class="pupil"><circle cx="60" cy="30" r="5"/></g>
            </g>
            <g class="glint-move">
                <circle cx="64.6" cy="25.4" r="2.3" fill="#fff" fill-opacity="0.95"/>
                <circle cx="56" cy="34.6" r="1" fill="#fff" fill-opacity="0.5"/>
            </g>
            <rect x="0" y="0" width="120" height="60" fill="url(#lidShadow)"/>
            <g class="lid">
                <path class="lid-fill" d="M-10 -50H130V2Q60 16 -10 2Z"/>
                <path class="lid-edge" d="M-10 2Q60 16 130 2"/>
            </g>
        </g>
        <path class="lash-top" d="M6 32C28 8 92 8 114 32"/>
        <path class="lash-bottom" d="M6 32C26 48 94 48 114 32"/>
    </svg>`;
    document.querySelectorAll('[data-eye]').forEach(el => { el.innerHTML = EYE_SVG; });

    // ---------- Eye movement: follows touch/cursor, glances around when idle ----------
    const rootEl = document.documentElement;
    let lastPointer = 0;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function lookAt(nx, ny) {
        rootEl.style.setProperty('--ex', (nx * 7).toFixed(2) + 'px');
        rootEl.style.setProperty('--ey', (ny * 3).toFixed(2) + 'px');
    }
    function onPointer(e) {
        lastPointer = Date.now();
        lookAt(clamp((e.clientX / window.innerWidth - 0.5) * 2, -1, 1),
               clamp((e.clientY / window.innerHeight - 0.5) * 2, -1, 1));
    }
    window.addEventListener('pointermove', onPointer);
    window.addEventListener('pointerdown', onPointer);
    setInterval(() => {
        if (Date.now() - lastPointer > 3500) {
            lookAt((Math.random() * 2 - 1), (Math.random() * 2 - 1) * 0.7);
        }
    }, 2600);

    // ---------- Safe storage helpers ----------
    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    // ---------- Theme ----------
    function applyTheme(themeName) {
        document.body.classList.remove('theme-amber', 'theme-pink');
        if (themeName === 'amber') document.body.classList.add('theme-amber');
        else if (themeName === 'pink') document.body.classList.add('theme-pink');

        document.querySelectorAll('.theme-sub-item').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-theme') === themeName);
        });
        store('shinu_theme', themeName);
    }
    document.querySelectorAll('.theme-sub-item').forEach(btn => {
        btn.onclick = () => applyTheme(btn.getAttribute('data-theme'));
    });
    applyTheme(load('shinu_theme') || 'purple');

    // ---------- Greeting ----------
    const hour = new Date().getHours();
    const greetingEl = document.getElementById('openGreeting');
    if (hour >= 5 && hour < 12) greetingEl.textContent = "Good morning!";
    else if (hour >= 12 && hour < 17) greetingEl.textContent = "Good afternoon!";
    else if (hour >= 17 && hour < 22) greetingEl.textContent = "Good evening!";
    else greetingEl.textContent = "Late night hustle?";

    // ---------- Elements ----------
    const menuToggle = document.getElementById('menuToggle');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const centerStage = document.getElementById('centerStage');
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const historyList = document.getElementById('historyList');
    const newChatBtn = document.getElementById('newChatBtn');
    const topicBar = document.getElementById('topicBar');
    const topicText = document.getElementById('topicText');

    function toggleDrawer() {
        sideDrawer.classList.toggle('open');
        drawerBackdrop.classList.toggle('active');
    }
    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('active');
    }
    menuToggle.onclick = toggleDrawer;
    drawerBackdrop.onclick = closeDrawer;

    // ---------- Topic helpers ----------
    function tryMath(q) {
        const expr = q.replace(/x/gi, '*').replace(/\^/g, '**');
        if (!/^[0-9+\-*/().%\s]+$/.test(expr) || !/[0-9]/.test(expr) || !/[+\-*/%]/.test(expr)) return null;
        try {
            const result = Function('"use strict"; return (' + expr + ')')();
            return (typeof result === 'number' && isFinite(result)) ? result : null;
        } catch (e) { return null; }
    }

    // Returns a short topic string, or null if the message is only a greeting
    function makeTopic(raw) {
        let t = raw.trim().replace(/\s+/g, ' ');
        if (tryMath(t.toLowerCase()) !== null) return 'Quick Calculation';
        if (/^(hello|hi+|hey+|yo|good (morning|afternoon|evening))\b[\s!.,?]*$/i.test(t)) return null;

        const lead = /^(please\s+|can you\s+|could you\s+|would you\s+|i want to\s+|i need to\s+|i would like to\s+|help me\s+(to\s+)?|tell me\s+(about\s+)?|(who|what)\s+(is|are|was|were)\s+(an?\s+|the\s+)?|what'?s\s+(an?\s+|the\s+)?|who'?s\s+|how\s+(do|can|to|does)\s+(i\s+|you\s+|we\s+)?|why\s+(is|are|do|does)\s+(the\s+)?|explain\s+(to me\s+)?|define\s+|describe\s+|show me\s+|give me\s+)/i;
        let prev;
        do { prev = t; t = t.replace(lead, ''); } while (t !== prev && t);

        t = t.replace(/[?.!,;:]+$/, '').trim();
        if (!t) t = raw.trim().replace(/[?.!]+$/, '');

        t = t.split(' ').slice(0, 5).join(' ');
        t = t.replace(/(^|\s)([a-z])/g, (m, s, c) => s + c.toUpperCase());
        if (t.length > 30) t = t.slice(0, 29).trim() + '…';
        return t || 'New Chat';
    }

    function updateTopicBar(topic) {
        const label = topic || 'New Chat';
        topicBar.classList.toggle('idle', !topic);
        document.title = topic ? topic + ' — Shinu' : 'Shinu — High-End AI Workspace';
        if (topicText.textContent === label) return;
        topicText.classList.add('swap');
        setTimeout(() => {
            topicText.textContent = label;
            topicText.classList.remove('swap');
        }, 170);
    }

    // ---------- Chat sessions ----------
    let chats = [];
    try { chats = JSON.parse(load('shinu_chats') || '[]'); } catch (e) { chats = []; }
    chats.forEach(c => { if (!c.topic) c.topic = c.title || 'Chat'; });
    let currentId = null;

    function saveChats() { store('shinu_chats', JSON.stringify(chats)); }
    function currentChat() { return chats.find(c => c.id === currentId) || null; }

    function showChatView() {
        centerStage.classList.add('dissolved');
        chatContainer.classList.add('active');
    }
    function showHomeView() {
        centerStage.classList.remove('dissolved');
        chatContainer.classList.remove('active');
    }

    function addBubble(role, text) {
        const div = document.createElement('div');
        div.className = 'message-bubble ' + role;
        div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
    }

    function renderHistory() {
        historyList.innerHTML = '';
        if (!chats.length) {
            const empty = document.createElement('div');
            empty.className = 'history-empty';
            empty.textContent = 'No chats yet.';
            historyList.appendChild(empty);
            return;
        }
        [...chats].reverse().forEach(chat => {
            const item = document.createElement('div');
            item.className = 'history-item' + (chat.id === currentId ? ' active' : '');

            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = chat.topic;

            const del = document.createElement('button');
            del.className = 'del';
            del.textContent = '✕';
            del.setAttribute('aria-label', 'Delete chat');
            del.onclick = (e) => {
                e.stopPropagation();
                chats = chats.filter(c => c.id !== chat.id);
                saveChats();
                if (chat.id === currentId) startNewChat(false);
                else renderHistory();
            };

            item.onclick = () => openChat(chat.id);
            item.appendChild(title);
            item.appendChild(del);
            historyList.appendChild(item);
        });
    }

    function openChat(id) {
        const chat = chats.find(c => c.id === id);
        if (!chat) return;
        currentId = id;
        chatContainer.innerHTML = '';
        chat.messages.forEach(m => addBubble(m.role, m.text));
        showChatView();
        updateTopicBar(chat.topic);
        renderHistory();
        closeDrawer();
    }

    function startNewChat(close = true) {
        currentId = null;
        chatContainer.innerHTML = '';
        showHomeView();
        updateTopicBar(null);
        renderHistory();
        userInput.value = '';
        if (close) closeDrawer();
    }
    newChatBtn.onclick = () => startNewChat(true);

    userInput.addEventListener('focus', showChatView);

    // ---------- Reply engine ----------
    function shinuReply(inputMessage) {
        const query = inputMessage.toLowerCase().trim();
        const has = (re) => re.test(query);

        const math = tryMath(query);
        if (math !== null) return inputMessage.trim() + " = " + math;

        if (has(/\b(hello|hi|hey)\b/)) {
            return "Hello! Shinu Engine 100x is fully operational. What are we building or exploring today?";
        } else if (has(/who are you|what is shinu/)) {
            return "I am Shinu, your high-end procedural AI interface and developer workspace engine.";
        } else if (has(/\b(version|v1)\b/)) {
            return "Shinu Engine v1.0 Pro (100x Quality Build) is live and online via Vercel.";
        } else if (has(/\b(help|options)\b/)) {
            return "Open the menu to start a New Chat, switch themes (Cosmic Purple, Neon Amber, Neon Pink) or reopen a previous chat from History!";
        } else if (has(/\btime\b/)) {
            return "Current system local time is " + new Date().toLocaleTimeString() + ".";
        }
        return `Pipeline compiled successfully for your query: "${inputMessage}". All systems nominal.`;
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        showChatView();

        let chat = currentChat();
        if (!chat) {
            chat = { id: Date.now().toString(36), topic: '', generic: false, messages: [] };
            chats.push(chat);
            currentId = chat.id;
            chatContainer.innerHTML = '';
        }

        // Set (or refine) the short topic shown in the bar
        if (!chat.topic || chat.generic) {
            const t = makeTopic(text);
            if (t) { chat.topic = t; chat.generic = false; }
            else if (!chat.topic) { chat.topic = 'Greeting'; chat.generic = true; }
        }
        updateTopicBar(chat.topic);

        chat.messages.push({ role: 'user', text });
        addBubble('user', text);
        saveChats();
        renderHistory();

        userInput.value = '';
        userInput.blur();

        const typing = document.createElement('div');
        typing.className = 'message-bubble bot';
        typing.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        chatContainer.appendChild(typing);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        const chatId = chat.id;
        setTimeout(() => {
            const reply = shinuReply(text);
            const target = chats.find(c => c.id === chatId);
            if (target) { target.messages.push({ role: 'bot', text: reply }); saveChats(); }
            if (currentId === chatId) {
                typing.remove();
                addBubble('bot', reply);
            }
        }, 600);
    }

    document.getElementById('sendBtn').onclick = handleSend;
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

    renderHistory();

    // ---------- Background canvas ----------
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 35; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 1.8 + 0.6,
            speedY: (Math.random() - 0.5) * 0.25,
            speedX: (Math.random() - 0.5) * 0.25,
            alpha: Math.random() * 0.6 + 0.2
        });
    }

    function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const isAmber = document.body.classList.contains('theme-amber');
        const isPink = document.body.classList.contains('theme-pink');

        let strokeColor = 'rgba(196, 150, 255, 0.14)';
        let strokeColor2 = 'rgba(210, 180, 255, 0.08)';
        let particleColor = '210, 180, 255';
        let glowColor = 'rgba(196, 150, 255, 0.15)';

        if (isAmber) {
            strokeColor = 'rgba(255, 170, 80, 0.14)';
            strokeColor2 = 'rgba(255, 200, 120, 0.08)';
            particleColor = '255, 200, 120';
            glowColor = 'rgba(255, 170, 80, 0.15)';
        } else if (isPink) {
            strokeColor = 'rgba(255, 105, 180, 0.14)';
            strokeColor2 = 'rgba(255, 160, 210, 0.08)';
            particleColor = '255, 160, 210';
            glowColor = 'rgba(255, 105, 180, 0.15)';
        }

        ctx.lineWidth = 1.2;
        ctx.strokeStyle = strokeColor;
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 480, Math.PI * 0.75, Math.PI * 1.35);
        ctx.stroke();

        ctx.strokeStyle = strokeColor2;
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 340, Math.PI * 0.8, Math.PI * 1.3);
        ctx.stroke();

        ctx.strokeStyle = strokeColor;
        ctx.beginPath();
        ctx.arc(-50, canvas.height + 50, 520, Math.PI * 1.7, Math.PI * 2.15);
        ctx.stroke();

        particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;

            ctx.fillStyle = `rgba(${particleColor}, ${p.alpha})`;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(drawBackground);
    }
    drawBackground();
</script>

</body>
</html>
