<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinu — Procedural Media Engine</title>
    <style>
        :root {
            --bg-color: #08080c;
            --panel-bg: rgba(18, 18, 28, 0.85);
            --accent: #ff9933;
            --text-main: #f0f0f5;
            --text-muted: #8888a0;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Minimalist Header */
        header {
            height: 50px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
        }

        .logo { font-weight: 700; font-size: 15px; letter-spacing: 2px; color: var(--accent); }
        .badge { font-size: 11px; background: rgba(255,153,51,0.15); color: var(--accent); padding: 4px 8px; border-radius: 12px; }

        /* Main Workspace Split */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Chat Sidebar */
        .chat-sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.4;
        }

        .message.bot { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-main); }
        .message.user { background: var(--accent); color: #000; align-self: flex-end; font-weight: 500; }

        .chat-input-box {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        button.send-btn {
            background: var(--accent);
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Canvas Stage Area */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #12121f 0%, #050508 100%);
            position: relative;
        }

        canvas {
            height: 75vh;
            aspect-ratio: 9 / 16;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            background: #000;
        }

        .stage-controls {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button.action-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.action-btn:hover { background: rgba(255,255,255,0.15); }
        button.action-btn.primary { background: var(--accent); color: #000; font-weight: 600; border: none; }

        /* Responsive Mobile Handling */
        @media (max-width: 768px) {
            .workspace { flex-direction: column-reverse; }
            .chat-sidebar { width: 100%; height: 40vh; }
            .stage { height: 60vh; }
            canvas { height: 45vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SHINU</div>
        <div class="badge">Training Tier (₹0)</div>
    </header>

    <div class="workspace">
        <!-- Chat Panel -->
        <div class="chat-sidebar">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">Welcome to Shinu. I am your procedural code engine. Type a prompt below to render high-end graphics instantly.</div>
            </div>
            <div class="chat-input-box">
                <input type="text" id="userInput" placeholder="Ask Shinu for a motion graphic..." />
                <button class="send-btn" id="sendBtn">→</button>
            </div>
        </div>

        <!-- Render Stage -->
        <div class="stage">
            <canvas id="engineCanvas" width="1080" height="1920"></canvas>
            <div class="stage-controls">
                <span id="statusText" style="font-size: 12px; color: var(--text-muted);">Engine Ready</span>
                <button class="action-btn primary" id="renderBtn">Render & Export MP4</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('engineCanvas');
    const ctx = canvas.getContext('2d');
    
    let frame = 0;
    const totalFrames = 150; 

    // High-End Shaded Procedural Renderer (Dense line hatching & gradients)
    function renderShadedFrame(f) {
        let width = canvas.width;
        let height = canvas.height;

        // Rich Contrasting Background Gradient
        let bgGrad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, width * 0.9);
        bgGrad.addColorStop(0, '#2e0821');  
        bgGrad.addColorStop(0.5, '#0d0514'); 
        bgGrad.addColorStop(1, '#020205');  
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // Multi-Layered Overlapping Line Hatching for Depth & Shading
        ctx.save();
        ctx.translate(width / 2, height / 2);
        
        for (let i = 0; i < 350; i++) {
            let angle = (i * 0.08) + (f * 0.008);
            let radius = 200 + (i * 1.2) + Math.sin(i * 0.2 + f * 0.03) * 40;
            
            ctx.beginPath();
            if (i % 2 === 0) {
                ctx.strokeStyle = `rgba(255, 170, 50, ${0.12 + (i/700)})`;
            } else {
                ctx.strokeStyle = `rgba(80, 200, 255, ${0.10 + (i/700)})`;
            }
            
            ctx.lineWidth = 1.5;
            ctx.arc(0, 0, radius, angle, angle + Math.PI * 1.4);
            ctx.stroke();
        }
        ctx.restore();

        // Additive Blending Core Glow
        ctx.globalCompositeOperation = 'screen';
        let coreGlow = ctx.createRadialGradient(width/2, height/2, 20, width/2, height/2, 400);
        coreGlow.addColorStop(0, 'rgba(255, 200, 50, 0.7)');
        coreGlow.addColorStop(0.4, 'rgba(255, 80, 0, 0.3)');
        coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGlow;
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'source-over';

        // Edge-to-Edge Typography
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#a0a0c0';
        ctx.font = '500 36px sans-serif';
        ctx.fillText("POWERED BY SHINU ENGINE", width / 2, 750);

        ctx.shadowColor = 'rgba(255, 120, 0, 0.6)';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 120px serif';
        ctx.fillText("SHINU", width / 2, 900);
        ctx.restore();
    }

    // Animation Loop
    function loop() {
        renderShadedFrame(frame);
        frame = (frame + 1) % totalFrames;
        requestAnimationFrame(loop);
    }
    loop();

    // Chat Interaction
    document.getElementById('sendBtn').onclick = handleUserPrompt;
    document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') handleUserPrompt(); };

    function handleUserPrompt() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        const messages = document.getElementById('chatMessages');
        messages.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';

        setTimeout(() => {
            messages.innerHTML += `<div class="message bot">Shinu processed prompt: "${text}". Rendering parameters adjusted successfully!</div>`;
            messages.scrollTop = messages.scrollHeight;
        }, 500);
    }

    // Client-Side Video Recording
    document.getElementById('renderBtn').onclick = () => {
        const statusText = document.getElementById('statusText');
        statusText.innerText = "Encoding Video Buffer...";
        
        const stream = canvas.captureStream(25);
        let options = { mimeType: 'video/webm; codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

        const recorder = new MediaRecorder(stream, options);
        let chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'shinu_render.webm';
            a.click();
            statusText.innerText = "Export Complete!";
        };

        recorder.start();
        let currentLoop = frame;
        const checkInterval = setInterval(() => {
            if (frame === currentLoop) {
                recorder.stop();
                clearInterval(checkInterval);
            }
        }, 100);
    };
</script>

</body>
</html>
