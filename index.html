<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinu — Procedural Media Engine</title>
    <style>
        :root {
            --bg-base: #060609;
            --panel-bg: rgba(12, 12, 18, 0.75);
            --panel-border: rgba(255, 255, 255, 0.06);
            --accent: #ff9933;
            --accent-glow: rgba(255, 153, 51, 0.2);
            --text-main: #ededf2;
            --text-muted: #787890;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Minimalist Header */
        header {
            height: 54px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo { font-weight: 700; font-size: 14px; letter-spacing: 3px; color: var(--text-main); }
        .badge { font-size: 10px; font-weight: 600; background: var(--accent-glow); color: var(--accent); padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px; border: 1px solid rgba(255,153,51,0.3); }

        /* Main Workspace Split */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Chat Sidebar */
        .chat-sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            backdrop-filter: blur(12px);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            font-size: 13.5px;
            padding-right: 4px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            max-width: 90%;
        }

        .message.bot { background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border); color: var(--text-main); align-self: flex-start; }
        .message.user { background: var(--accent); color: #050508; align-self: flex-end; font-weight: 600; box-shadow: 0 4px 20px var(--accent-glow); }

        .chat-input-box {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 6px 6px 6px 14px;
            transition: border-color 0.2s;
        }

        .chat-input-box:focus-within { border-color: var(--accent); }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13.5px;
            outline: none;
        }

        input::placeholder { color: var(--text-muted); }

        button.send-btn {
            background: var(--accent);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            transition: transform 0.1s;
        }

        button.send-btn:active { transform: scale(0.95); }

        /* Canvas Stage Area */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #11111d 0%, #06060a 100%);
            position: relative;
            padding: 20px;
        }

        canvas {
            height: 72vh;
            aspect-ratio: 9 / 16;
            border-radius: 14px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px var(--panel-border);
            background: #000;
        }

        .stage-controls {
            margin-top: 18px;
            display: flex;
            gap: 14px;
            align-items: center;
            background: var(--panel-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
        }

        #statusText { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        button.action-btn {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.action-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
        button.action-btn.primary { background: var(--accent); color: #000; font-weight: 600; border: none; box-shadow: 0 4px 15px var(--accent-glow); }

        /* Responsive Mobile Handling */
        @media (max-width: 768px) {
            .workspace { flex-direction: column-reverse; }
            .chat-sidebar { width: 100%; height: 38vh; padding: 14px; }
            .stage { height: 62vh; padding: 10px; }
            canvas { height: 42vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo">SHINU</div>
            <div class="badge">PROD</div>
        </div>
        <div style="font-size: 12px; color: var(--text-muted);">Engine v1.0</div>
    </header>

    <div class="workspace">
        <!-- Chat Panel -->
        <div class="chat-sidebar">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">Shinu engine initialized. Ready for procedural rendering workflows.</div>
            </div>
            <div class="chat-input-box">
                <input type="text" id="userInput" placeholder="Prompt Shinu for visual instructions..." />
                <button class="send-btn" id="sendBtn">↑</button>
            </div>
        </div>

        <!-- Render Stage -->
        <div class="stage">
            <canvas id="engineCanvas" width="1080" height="1920"></canvas>
            <div class="stage-controls">
                <span id="statusText">Ready</span>
                <button class="action-btn primary" id="renderBtn">Export MP4</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('engineCanvas');
    const ctx = canvas.getContext('2d');
    
    let frame = 0;
    const totalFrames = 150; 

    function renderShadedFrame(f) {
        let width = canvas.width;
        let height = canvas.height;

        let bgGrad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, width * 0.9);
        bgGrad.addColorStop(0, '#28071e');  
        bgGrad.addColorStop(0.5, '#0b0412'); 
        bgGrad.addColorStop(1, '#020205');  
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(width / 2, height / 2);
        
        for (let i = 0; i < 350; i++) {
            let angle = (i * 0.08) + (f * 0.008);
            let radius = 200 + (i * 1.2) + Math.sin(i * 0.2 + f * 0.03) * 40;
            
            ctx.beginPath();
            if (i % 2 === 0) {
                ctx.strokeStyle = `rgba(255, 170, 50, ${0.12 + (i/700)})`;
            } else {
                ctx.strokeStyle = `rgba(80, 200, 255, ${0.10 + (i/700)})`;
            }
            
            ctx.lineWidth = 1.5;
            ctx.arc(0, 0, radius, angle, angle + Math.PI * 1.4);
            ctx.stroke();
        }
        ctx.restore();

        ctx.globalCompositeOperation = 'screen';
        let coreGlow = ctx.createRadialGradient(width/2, height/2, 20, width/2, height/2, 400);
        coreGlow.addColorStop(0, 'rgba(255, 200, 50, 0.7)');
        coreGlow.addColorStop(0.4, 'rgba(255, 80, 0, 0.3)');
        coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGlow;
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'source-over';

        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8e8ea0';
        ctx.font = '500 36px sans-serif';
        ctx.fillText("POWERED BY SHINU ENGINE", width / 2, 750);

        ctx.shadowColor = 'rgba(255, 120, 0, 0.6)';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 120px serif';
        ctx.fillText("SHINU", width / 2, 900);
        ctx.restore();
    }

    function loop() {
        renderShadedFrame(frame);
        frame = (frame + 1) % totalFrames;
        requestAnimationFrame(loop);
    }
    loop();

    document.getElementById('sendBtn').onclick = handleUserPrompt;
    document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') handleUserPrompt(); };

    function handleUserPrompt() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        const messages = document.getElementById('chatMessages');
        messages.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';

        setTimeout(() => {
            messages.innerHTML += `<div class="message bot">Pipeline compiled for: "${text}". Frame parameters re-weighted.</div>`;
            messages.scrollTop = messages.scrollHeight;
        }, 400);
    }

    document.getElementById('renderBtn').onclick = () => {
        const statusText = document.getElementById('statusText');
        statusText.innerText = "Encoding...";
        
        const stream = canvas.captureStream(25);
        let options = { mimeType: 'video/webm; codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

        const recorder = new MediaRecorder(stream, options);
        let chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'shinu_render.webm';
            a.click();
            statusText.innerText = "Ready";
        };

        recorder.start();
        let currentLoop = frame;
        const checkInterval = setInterval(() => {
            if (frame === currentLoop) {
                recorder.stop();
                clearInterval(checkInterval);
            }
        }, 100);
    };
</script>

</body>
</html>
