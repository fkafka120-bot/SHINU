<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinu — High-End AI Workspace</title>
    <style>
        :root {
            --bg-color: #030107;
            --panel-bg: rgba(14, 10, 24, 0.75);
            --panel-border: rgba(196, 150, 255, 0.18);
            --accent-purple: #c496ff;
            --accent-glow: rgba(196, 150, 255, 0.35);
            --text-main: #f4ecff;
            --text-muted: #8d7b9e;
        }

        /* Amber Theme 100x */
        body.theme-amber {
            --bg-color: #070402;
            --panel-bg: rgba(22, 14, 10, 0.75);
            --panel-border: rgba(255, 170, 80, 0.22);
            --accent-purple: #ffaa50;
            --accent-glow: rgba(255, 170, 80, 0.35);
            --text-main: #fff5ec;
            --text-muted: #9e8c7a;
        }

        /* Neon Pink Theme 100x */
        body.theme-pink {
            --bg-color: #070206;
            --panel-bg: rgba(22, 10, 18, 0.75);
            --panel-border: rgba(255, 105, 180, 0.22);
            --accent-purple: #ff69b4;
            --accent-glow: rgba(255, 105, 180, 0.35);
            --text-main: #ffecfa;
            --text-muted: #9e7a8e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 16px;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 480px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            flex-shrink: 0;
        }

        .menu-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s;
        }
        .menu-btn:hover { transform: scale(1.05); border-color: var(--accent-purple); }

        .menu-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: background-color 0.3s;
        }

        /* Sliding Drawer (100x Glassmorphic Style) */
        .drawer {
            position: fixed;
            top: 0;
            left: -340px;
            width: 340px;
            height: 100vh;
            background: rgba(8, 6, 14, 0.92);
            border-right: 1px solid var(--panel-border);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s;
            z-index: 50;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 20px 0 60px rgba(0,0,0,0.8);
        }
        body.theme-amber .drawer { background: rgba(14, 10, 8, 0.92); }
        body.theme-pink .drawer { background: rgba(14, 6, 11, 0.92); }
        .drawer.open { left: 0; }
        
        .drawer-section-title { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--accent-purple); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
        }

        .drawer-item {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-item:hover { background: rgba(255, 255, 255, 0.07); transform: translateX(4px); }

        .theme-submenu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
            padding-left: 12px;
            border-left: 2px solid var(--panel-border);
        }
        .theme-sub-item {
            padding: 10px 14px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .theme-sub-item:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.04); }
        .theme-sub-item.active { color: var(--accent-purple); border-color: var(--panel-border); background: rgba(255, 255, 255, 0.06); font-weight: 600; }
        
        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 35vh;
        }
        .history-item {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-main);
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 40;
        }
        .backdrop.active { opacity: 1; pointer-events: auto; }

        /* Central Stage: High-End Floating Motif */
        .center-stage {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }

        .center-stage.dissolved {
            opacity: 0;
            pointer-events: none;
        }

        .eye-container {
            width: 120px;
            height: 60px;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 25px var(--accent-glow));
            animation: eyeBlink 4.5s infinite ease-in-out;
        }

        @keyframes eyeBlink {
            0%, 46%, 54%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.06); }
        }

        .brand-title {
            font-size: 36px;
            letter-spacing: 14px;
            color: var(--text-main);
            font-weight: 300;
            margin-bottom: 12px;
            text-shadow: 0 0 30px var(--accent-glow);
            margin-left: 14px;
        }

        .brand-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--accent-purple);
            opacity: 0.8;
            margin-bottom: 18px;
        }

        .brand-divider::before, .brand-divider::after {
            content: '';
            width: 70px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
        }

        .open-greeting {
            font-size: 16.5px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.8px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        /* Chat Stream Container (100x Quality Flow) */
        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 480px;
            z-index: 5;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 10px 4px;
            scroll-behavior: smooth;
            opacity: 0;
            transition: opacity 0.6s ease;
            margin-bottom: 12px;
        }
        .chat-container.active { opacity: 1; }
        
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .message-bubble {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeInBubble 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        @keyframes fadeInBubble {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-bubble.user {
            background: var(--accent-purple);
            color: #050308;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            font-weight: 600;
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .message-bubble.bot {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        /* Input Dock (100x Polished Glassmorphism) */
        .input-dock {
            width: 100%;
            max-width: 480px;
            z-index: 10;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 34px;
            padding: 8px 8px 8px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            flex-shrink: 0;
            transition: border-color 0.3s;
        }
        .input-dock:focus-within { border-color: var(--accent-purple); }

        .action-icon-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            color: var(--accent-purple);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-icon-btn:hover { background: rgba(255, 255, 255, 0.09); transform: scale(1.05); }

        .input-dock input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14.5px;
            outline: none;
        }
        .input-dock input::placeholder { color: var(--text-muted); }

        .send-icon-btn {
            background: var(--accent-purple);
            border: none;
            color: #050308;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.2s, filter 0.2s;
        }
        .send-icon-btn:hover { filter: brightness(1.1); }
        .send-icon-btn:active { transform: scale(0.92); }
        .send-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <button class="menu-btn" id="menuToggle" title="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Sliding Menu Drawer -->
    <div class="drawer" id="sideDrawer">
        <div>
            <div class="drawer-section-title">1. Theme Options</div>
            <div class="theme-submenu">
                <button class="theme-sub-item active" data-theme="purple">Cosmic Purple</button>
                <button class="theme-sub-item" data-theme="amber">Neon Amber</button>
                <button class="theme-sub-item" data-theme="pink">Neon Pink</button>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">2. History</div>
            <div class="chat-history-list" id="historyList">
                <div style="font-size: 13.5px; color: var(--text-muted);">No prompts typed yet.</div>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">3. Account Setting</div>
            <div class="drawer-item">Configure Profile</div>
        </div>
    </div>
    <div class="backdrop" id="drawerBackdrop"></div>

    <!-- Central Stage -->
    <div class="center-stage" id="centerStage">
        <div class="eye-container">
            <svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent-purple);">
                <path d="M5 30C30 10 90 10 115 30C90 50 30 50 5 30Z" />
                <circle cx="60" cy="30" r="12" fill="currentColor" opacity="0.85" />
                <circle cx="60" cy="30" r="5" fill="#ffffff" />
            </svg>
        </div>
        <h1 class="brand-title">SHINU</h1>
        <div class="brand-divider">·</div>
        <div class="open-greeting" id="openGreeting">Good morning!</div>
    </div>

    <!-- Live Messaging Feed -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Input Dock -->
    <div class="input-dock" id="inputDock">
        <button class="action-icon-btn">+</button>
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button class="send-icon-btn" id="sendBtn">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

<script>
    // Saved Theme Management
    const savedTheme = localStorage.getItem('shinu_theme') || 'purple';
    applyTheme(savedTheme);

    function applyTheme(themeName) {
        document.body.classList.remove('theme-amber', 'theme-pink');
        if(themeName === 'amber') {
            document.body.classList.add('theme-amber');
        } else if(themeName === 'pink') {
            document.body.classList.add('theme-pink');
        }
        
        document.querySelectorAll('.theme-sub-item').forEach(btn => {
            if(btn.getAttribute('data-theme') === themeName) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        localStorage.setItem('shinu_theme', themeName);
    }

    document.querySelectorAll('.theme-sub-item').forEach(btn => {
        btn.onclick = () => {
            applyTheme(btn.getAttribute('data-theme'));
        };
    });

    // Time-aware greeting
    const hour = new Date().getHours();
    const greetingEl = document.getElementById('openGreeting');
    if (hour >= 5 && hour < 12) {
        greetingEl.textContent = "Good morning!";
    } else if (hour >= 12 && hour < 17) {
        greetingEl.textContent = "Good afternoon!";
    } else if (hour >= 17 && hour < 22) {
        greetingEl.textContent = "Good evening!";
    } else {
        greetingEl.textContent = "Late night hustle?";
    }

    const menuToggle = document.getElementById('menuToggle');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const centerStage = document.getElementById('centerStage');
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const historyList = document.getElementById('historyList');

    function toggleDrawer() {
        sideDrawer.classList.toggle('open');
        drawerBackdrop.classList.toggle('active');
    }

    menuToggle.onclick = toggleDrawer;
    drawerBackdrop.onclick = toggleDrawer;

    let chatStarted = false;

    userInput.addEventListener('focus', () => {
        if(!chatStarted) {
            centerStage.classList.add('dissolved');
            chatContainer.classList.add('active');
            chatStarted = true;
        }
    });

    // Shinu Reply Intelligence Engine
    function shinuReply(inputMessage) {
        const query = inputMessage.toLowerCase().trim();

        if (query.includes('hello') || query.includes('hi') || query.includes('hey')) {
            return "Hello! Shinu Engine 100x is fully operational. What are we building or exploring today?";
        } else if (query.includes('who are you') || query.includes('what is shinu')) {
            return "I am Shinu, your high-end procedural AI interface and developer workspace engine.";
        } else if (query.includes('version') || query.includes('v1')) {
            return "Shinu Engine v1.0 Pro (100x Quality Build) is live and online via Vercel.";
        } else if (query.includes('help') || query.includes('options')) {
            return "You can use the 3-lines menu to switch themes (Cosmic Purple, Neon Amber, Neon Pink) or review your typed history!";
        } else if (query.includes('time')) {
            return "Current system local time is " + new Date().toLocaleTimeString() + ".";
        } else {
            return `Pipeline compiled successfully for your query: "${inputMessage}". All systems nominal.`;
        }
    }

    function handleSend() {
        const text = userInput.value.trim();
        if(!text) return;

        if(!chatStarted) {
            centerStage.classList.add('dissolved');
            chatContainer.classList.add('active');
            chatStarted = true;
        }

        chatContainer.innerHTML += `<div class="message-bubble user">${escapeHtml(text)}</div>`;
        chatContainer.scrollTop = chatContainer.scrollHeight;

        if(historyList.innerHTML.includes('No prompts typed yet')) {
            historyList.innerHTML = '';
        }
        historyList.innerHTML += `<div class="history-item">${escapeHtml(text)}</div>`;

        userInput.value = '';
        userInput.blur();

        setTimeout(() => {
            const responseText = shinuReply(text);
            chatContainer.innerHTML += `<div class="message-bubble bot">${escapeHtml(responseText)}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 500);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('sendBtn').onclick = handleSend;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };

    // 100x High-Precision Background Particle & Aura Canvas
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    let waveOffset = 0;
    const particles = [];
    for(let i = 0; i < 35; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 1.8 + 0.6,
            speedY: (Math.random() - 0.5) * 0.25,
            speedX: (Math.random() - 0.5) * 0.25,
            alpha: Math.random() * 0.6 + 0.2
        });
    }

    function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const isAmber = document.body.classList.contains('theme-amber');
        const isPink = document.body.classList.contains('theme-pink');
        
        let strokeColor = 'rgba(196, 150, 255, 0.14)';
        let strokeColor2 = 'rgba(210, 180, 255, 0.08)';
        let particleColor = '210, 180, 255';
        let glowColor = 'rgba(196, 150, 255, 0.15)';

        if(isAmber) {
            strokeColor = 'rgba(255, 170, 80, 0.14)';
            strokeColor2 = 'rgba(255, 200, 120, 0.08)';
            particleColor = '255, 200, 120';
            glowColor = 'rgba(255, 170, 80, 0.15)';
        } else if(isPink) {
            strokeColor = 'rgba(255, 105, 180, 0.14)';
            strokeColor2 = 'rgba(255, 160, 210, 0.08)';
            particleColor = '255, 160, 210';
            glowColor = 'rgba(255, 105, 180, 0.15)';
        }

        // Multi-layered Orbital Arcs
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = strokeColor;
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 480, Math.PI * 0.75, Math.PI * 1.35);
        ctx.stroke();

        ctx.strokeStyle = strokeColor2;
        ctx.beginPath();
        ctx.arc(canvas.width + 50, -50, 340, Math.PI * 0.8, Math.PI * 1.3);
        ctx.stroke();

        ctx.strokeStyle = strokeColor;
        ctx.beginPath();
        ctx.arc(-50, canvas.height + 50, 520, Math.PI * 1.7, Math.PI * 2.15);
        ctx.stroke();

        waveOffset += 0.35;

        // Render High-Precision Floating Particles with Glow
        particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;

            if(p.y < 0) p.y = canvas.height;
            if(p.y > canvas.height) p.y = 0;
            if(p.x < 0) p.x = canvas.width;
            if(p.x > canvas.width) p.x = 0;

            ctx.fillStyle = `rgba(${particleColor}, ${p.alpha})`;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(drawBackground);
    }
    drawBackground();
</script>

</body>
</html>
