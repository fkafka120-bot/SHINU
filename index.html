<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shinu — High-End AI Workspace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <button class="menu-btn" id="menuToggle" title="Menu" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
        <div class="topic-bar idle" id="topicBar">
            <span class="topic-dot"></span>
            <span class="topic-label">Topic</span>
            <span class="topic-divider"></span>
            <span class="topic-text" id="topicText">New Chat</span>
            <span class="auto-train-pill" id="headerBrainPill" title="Neural Memory Nodes">🧠 0</span>
        </div>
    </header>

    <!-- Sliding Menu Drawer -->
    <div class="drawer" id="sideDrawer">
        <div class="drawer-brand">
            <div class="mini-eye" data-eye></div>
            <span>SHINU</span>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New Chat
        </button>

        <div>
            <div class="drawer-section-title">1. Theme Options</div>
            <div class="theme-submenu">
                <button class="theme-sub-item active" data-theme="purple"><span class="dot" style="--dot:#c496ff"></span>Cosmic Purple</button>
                <button class="theme-sub-item" data-theme="amber"><span class="dot" style="--dot:#ffaa50"></span>Neon Amber</button>
                <button class="theme-sub-item" data-theme="pink"><span class="dot" style="--dot:#ff69b4"></span>Neon Pink</button>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">2. Self-Teaching Brain</div>
            <div class="drawer-item" id="openTrainModalBtn">
                <span>Neural Training Studio</span>
                <span class="brain-badge" id="brainCountBadge">0 skills</span>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">3. Connected Platforms</div>
            <div class="platform-pills">
                <span class="plat-pill" data-prefix="insta ">📸 Instagram</span>
                <span class="plat-pill" data-prefix="fb ">📘 Facebook</span>
                <span class="plat-pill" data-prefix="reddit ">👽 Reddit</span>
                <span class="plat-pill" data-prefix="wiki ">🌐 Wikipedia</span>
                <span class="plat-pill" data-prefix="archive ">🏛️ Archive</span>
            </div>
        </div>
        <div>
            <div class="drawer-section-title">4. History</div>
            <div class="chat-history-list" id="historyList"></div>
        </div>
    </div>
    <div class="backdrop" id="drawerBackdrop"></div>

    <!-- Neural Training Studio Modal -->
    <div class="modal-overlay" id="trainModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Neural Training Studio</h2>
                <button class="close-modal" id="closeTrainModal">✕</button>
            </div>
            <div class="auto-status-bar">
                <span id="crawlerStatusText">🧠 Deep Web Synthesis: Ready</span>
                <button class="train-secondary-btn" id="harvestNowBtn">+ Deep-Learn Topic</button>
            </div>
            <div class="train-form">
                <input type="text" class="train-input" id="trainTriggerInput" placeholder="Concept or trigger (e.g. curvature, human behaviour)..." />
                <input type="text" class="train-input" id="trainResponseInput" placeholder="Custom rule OR leave blank to auto-research from web!" />
                <div class="train-btn-row">
                    <button class="train-save-btn" id="saveTrainBtn">+ Train Shinu</button>
                    <button class="train-secondary-btn" id="clearJunkBtn" title="Remove old random nodes">Clean</button>
                    <button class="train-secondary-btn" id="exportBrainBtn">Export</button>
                </div>
            </div>
            <div class="drawer-section-title" style="margin-bottom:0;">Synthesized Knowledge Graph</div>
            <div class="memory-list" id="memoryList"></div>
        </div>
    </div>

    <!-- Central Stage -->
    <div class="center-stage" id="centerStage">
        <div class="eye-container" data-eye></div>
        <h1 class="brand-title">SHINU</h1>
        <div class="brand-divider">·</div>
        <div class="open-greeting" id="openGreeting">Good morning!</div>
    </div>

    <!-- Live Messaging Feed -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- Input Dock -->
    <div class="input-dock" id="inputDock">
        <button class="action-icon-btn" id="quickHelpBtn" title="Platforms & Commands">+</button>
        <input type="text" id="userInput" placeholder="Ask anything, 'insta/fb/reddit [topic]', or 'teach: [topic]'..." autocomplete="off" />
        <button class="send-icon-btn" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script src="ui.js"></script>
    <script src="engine.js"></script>
</body>
</html>
