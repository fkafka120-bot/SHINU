<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinu — Media Engine</title>
    <style>
        :root {
            --bg-base: #060609;
            --panel-bg: rgba(12, 12, 18, 0.85);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #ff9933;
            --accent-glow: rgba(255, 153, 51, 0.2);
            --text-main: #ededf2;
            --text-muted: #787890;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Minimalist Header with Sidebar Toggle */
        header {
            height: 60px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            z-index: 20;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Sliding Window Pane Toggle Button */
        .menu-btn {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .menu-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); }
        .menu-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .logo { font-weight: 700; font-size: 15px; letter-spacing: 3px; color: var(--text-main); }

        /* Sliding Pane Drawer */
        .drawer {
            position: fixed;
            top: 60px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 60px);
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 30;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .drawer.open { left: 0; }
        .drawer-title { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        .drawer-item { padding: 10px 14px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border); cursor: pointer; font-size: 13.5px; transition: background 0.2s; }
        .drawer-item:hover { background: rgba(255,255,255,0.08); }

        /* Main Stage & Input Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: radial-gradient(circle at center, #11111d 0%, #06060a 100%);
            overflow: hidden;
        }

        canvas {
            height: 62vh;
            aspect-ratio: 9 / 16;
            border-radius: 14px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px var(--panel-border);
            background: #000;
        }

        /* Clean Search Input Bar */
        .search-dock {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 8px 8px 8px 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input::placeholder { color: var(--text-muted); }

        button.search-btn {
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.1s;
        }

        button.search-btn:active { transform: scale(0.96); }

        /* Overlay Backdrop when drawer is open */
        .backdrop {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 60px);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 25;
        }
        .backdrop.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <!-- Sliding Window Pane Button -->
            <button class="menu-btn" id="menuToggle" title="Options">
                <svg viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
            <div class="logo">SHINU</div>
        </div>
        <div style="font-size: 11px; color: var(--text-muted);">v1.0 Pro</div>
    </header>

    <!-- Sliding Window Pane Drawer -->
    <div class="drawer" id="sideDrawer">
        <div class="drawer-title">Engine Options</div>
        <div class="drawer-item" id="exportOption">Export Current Frame (MP4)</div>
        <div class="drawer-item">Rendering Presets</div>
        <div class="drawer-item">Copyright & Licensing</div>
    </div>
    <div class="backdrop" id="drawerBackdrop"></div>

    <!-- Main Workspace -->
    <div class="main-container">
        <canvas id="engineCanvas" width="1080" height="1920"></canvas>

        <!-- Search Input Bar & Button -->
        <div class="search-dock">
            <input type="text" id="searchInput" placeholder="Search or prompt visual engine..." />
            <button class="search-btn" id="searchBtn">Search</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('engineCanvas');
    const ctx = canvas.getContext('2d');
    
    let frame = 0;
    const totalFrames = 150; 

    // Sliding Drawer Logic
    const menuToggle = document.getElementById('menuToggle');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    function toggleDrawer() {
        sideDrawer.classList.toggle('open');
        drawerBackdrop.classList.toggle('active');
    }

    menuToggle.onclick = toggleDrawer;
    drawerBackdrop.onclick = toggleDrawer;

    // Procedural Renderer Animation Loop
    function renderShadedFrame(f) {
        let width = canvas.width;
        let height = canvas.height;

        let bgGrad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, width * 0.9);
        bgGrad.addColorStop(0, '#28071e');  
        bgGrad.addColorStop(0.5, '#0b0412'); 
        bgGrad.addColorStop(1, '#020205');  
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(width / 2, height / 2);
        
        for (let i = 0; i < 350; i++) {
            let angle = (i * 0.08) + (f * 0.008);
            let radius = 200 + (i * 1.2) + Math.sin(i * 0.2 + f * 0.03) * 40;
            
            ctx.beginPath();
            if (i % 2 === 0) {
                ctx.strokeStyle = `rgba(255, 170, 50, ${0.12 + (i/700)})`;
            } else {
                ctx.strokeStyle = `rgba(80, 200, 255, ${0.10 + (i/700)})`;
            }
            
            ctx.lineWidth = 1.5;
            ctx.arc(0, 0, radius, angle, angle + Math.PI * 1.4);
            ctx.stroke();
        }
        ctx.restore();

        ctx.globalCompositeOperation = 'screen';
        let coreGlow = ctx.createRadialGradient(width/2, height/2, 20, width/2, height/2, 400);
        coreGlow.addColorStop(0, 'rgba(255, 200, 50, 0.7)');
        coreGlow.addColorStop(0.4, 'rgba(255, 80, 0, 0.3)');
        coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGlow;
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'source-over';

        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8e8ea0';
        ctx.font = '500 36px sans-serif';
        ctx.fillText("POWERED BY SHINU ENGINE", width / 2, 750);

        ctx.shadowColor = 'rgba(255, 120, 0, 0.6)';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 120px serif';
        ctx.fillText("SHINU", width / 2, 900);
        ctx.restore();
    }

    function loop() {
        renderShadedFrame(frame);
        frame = (frame + 1) % totalFrames;
        requestAnimationFrame(loop);
    }
    loop();

    // Search Trigger
    document.getElementById('searchBtn').onclick = handleSearch;
    document.getElementById('searchInput').onkeypress = (e) => { if(e.key === 'Enter') handleSearch(); };

    function handleSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if(!query) return;
        alert(`Searching / Executing prompt: "${query}"`);
    }

    // Export Trigger from Drawer Menu
    document.getElementById('exportOption').onclick = () => {
        toggleDrawer();
        const stream = canvas.captureStream(25);
        let options = { mimeType: 'video/webm; codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

        const recorder = new MediaRecorder(stream, options);
        let chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'shinu_render.webm';
            a.click();
        };

        recorder.start();
        let currentLoop = frame;
        const checkInterval = setInterval(() => {
            if (frame === currentLoop) {
                recorder.stop();
                clearInterval(checkInterval);
            }
        }, 100);
    };
</script>

</body>
</html>
